name: Extract Chemistry Lab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/project
          unzip -o "virtual-chemistry-lab-redesign (2).zip" -d /tmp/project
          cp -a /tmp/project/. .
          rm -f "virtual-chemistry-lab-redesign (2).zip"

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract virtual chemistry lab source"
            git push
          fi
